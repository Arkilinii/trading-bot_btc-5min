<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Bot Trading</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #111;

    color: #eee;

    font-family: Cambria, Georgia, serif;
}

.container {

    width: 95%;

    max-width: 1500px;

    margin: 30px auto;
}

h1 {
    margin: 0;
}

.subtitle {

    color: #888;

    margin-top: 5px;

    margin-bottom: 25px;
}

.top {

    background: #1b1b1b;

    padding: 20px;

    border-radius: 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}

.mode-area {

    display: flex;

    align-items: center;

    gap: 15px;
}


/* ========================================================= */
/* PAPER / LIVE SWITCH */
/* ========================================================= */

.mode-switch {

    display: flex;

    align-items: center;

    height: 56px;

    background: #292929;

    border: 1px solid #3d3d3d;

    border-radius: 10px;

    padding: 6px 12px;

    gap: 8px;

    min-width: 250px;

    box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
}


/* ========================================================= */
/* LABELS */
/* ========================================================= */

.mode-label {

    width: 85px;

    text-align: center;

    font-weight: bold;

    font-size: 15px;

    user-select: none;

    transition:
        color 0.2s ease,
        opacity 0.2s ease;
}

.paper-label {

    color: #32d74b;
}

.live-label {

    color: #666;
}


/* ========================================================= */
/* SWITCH */
/* ========================================================= */

.mode-toggle {

    position: relative;

    width: 70px;

    height: 40px;

    padding: 0;

    border: none;

    border-radius: 20px;

    background: #3a3a3a;

    cursor: pointer;

    transition:
        background 0.2s ease;
}

.mode-toggle:hover {

    background: #444;
}

.mode-toggle:disabled {

    cursor: not-allowed;

    opacity: 0.7;
}


/* ========================================================= */
/* CÍRCULO */
/* ========================================================= */

.toggle-circle {

    position: absolute;

    top: 5px;

    left: 5px;

    width: 30px;

    height: 30px;

    border-radius: 50%;

    background: #32d74b;

    box-shadow:
        0 2px 5px rgba(0, 0, 0, 0.45);

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}


/* ========================================================= */
/* PAPER ACTIVO */
/* ========================================================= */

.mode-toggle.paper-active {

    background: #214d29;
}

.mode-toggle.paper-active .toggle-circle {

    transform: translateX(0);

    background: #32d74b;
}


/* ========================================================= */
/* LIVE ACTIVO */
/* ========================================================= */

.mode-toggle.live-active {

    background: #5a2421;
}

.mode-toggle.live-active .toggle-circle {

    transform: translateX(30px);

    background: #ff453a;
}


/* ========================================================= */
/* LABEL LIVE ACTIVO */
/* ========================================================= */

.mode-switch.live-selected .paper-label {

    color: #666;
}

.mode-switch.live-selected .live-label {

    color: #ff453a;
}


/* ========================================================= */
/* LABEL PAPER ACTIVO */
/* ========================================================= */

.mode-switch.paper-selected .paper-label {

    color: #32d74b;
}

.mode-switch.paper-selected .live-label {

    color: #666;
}


/* ========================================================= */
/* STATUS */
/* ========================================================= */

.status-area {

    display: flex;

    align-items: center;

    gap: 15px;
}

.status {

    font-weight: bold;

    font-size: 16px;

    margin-top: 0;
}

.running {
    color: #32d74b;
}

.stopped {
    color: #ff453a;
}

.live-warning {

    color: #ff453a;

    font-weight: bold;

    display: none;

    margin-top: 0;
}


/* ========================================================= */
/* BUTTONS */
/* ========================================================= */

.buttons {

    display: flex;

    gap: 10px;
}

button {

    border: none;

    padding: 12px 22px;

    border-radius: 7px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    font-family: Cambria, Georgia, serif;
}

.start {

    background: #32d74b;

    color: black;
}

.stop {

    background: #ff453a;

    color: white;
}

button:disabled {

    opacity: 0.35;

    cursor: not-allowed;
}


/* ========================================================= */
/* LOG PANEL */
/* ========================================================= */

.panel {

    background: #1b1b1b;

    padding: 20px;

    border-radius: 10px;
}

.panel-header {

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    margin-bottom: 15px;
}


/* ========================================================= */
/* NAVEGACIÓN */
/* ========================================================= */

.log-navigation {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;
}


/* ========================================================= */
/* BOTÓN NOW */
/* ========================================================= */

#nowButton {

    background: #292929;

    color: white;

    border: 1px solid #444;

    padding: 10px 16px;

    border-radius: 6px;

    font-size: 15px;

    font-family: Cambria, Georgia, serif;

    cursor: pointer;
}

#nowButton:hover {

    background: #3a3a3a;
}

#nowButton.active {

    background: #444;

    border-color: #666;
}


/* ========================================================= */
/* SELECT HISTORY / TRADES */
/* ========================================================= */

.log-select {

    background: #222;

    color: white;

    border: 1px solid #444;

    padding: 10px;

    border-radius: 6px;

    font-size: 15px;

    font-family: Cambria, Georgia, serif;

    cursor: pointer;
}

.log-select.placeholder {

    color: #666;
}

.log-select option {

    background: #222;

    color: white;
}

.log-select option.placeholder-option {

    color: #666;
}


/* ========================================================= */
/* CONTENEDOR LOGS */
/* ========================================================= */

.logs-container {

    position: relative;
}


/* ========================================================= */
/* LOGS */
/* ========================================================= */

#logs {

    background: #080808;

    border-radius: 7px;

    padding: 15px;

    height: 700px;

    overflow-y: auto;

    scrollbar-gutter: stable;

    scroll-behavior: auto !important;

    white-space: pre-wrap;

    font-family: "Courier New", monospace;

    font-size: 13px;

    line-height: 1.45;
}


/* ========================================================= */
/* SAVE LOGS */
/* ========================================================= */

#saveLogs {

    position: absolute;

    top: 8px;

    right: 8px;

    padding: 5px 12px;

    background: #292929;

    color: #ffffff;

    border: 1px solid #444;

    border-radius: 6px;

    font-family: Cambria, Georgia, serif;

    font-size: 12px;

    cursor: pointer;

    z-index: 2;
}

#saveLogs:hover {

    background: #3a3a3a;
}

#saveLogs:disabled {

    opacity: 0.35;

    cursor: not-allowed;
}


/* ========================================================= */
/* IR AL FINAL */
/* ========================================================= */

#goBottom {

    display: block;

    margin: 8px auto 0;

    padding: 5px 12px;

    background: #292929;

    color: #ffffff;

    border: 1px solid #444;

    border-radius: 6px;

    font-family: Cambria, Georgia, serif;

    font-size: 12px;

    cursor: pointer;
}

#goBottom:hover {

    background: #3a3a3a;
}

</style>

</head>

<body>

<div class="container">

<h1>Bot trading - BTC 5m Strategy - Polymarket</h1>

<div class="subtitle">
by Arkilinux
</div>


<!-- ===================================================== -->
<!-- CONTROL -->
<!-- ===================================================== -->

<div class="top">

<div>

<div class="mode-area">


<!-- ================================================= -->
<!-- PAPER / LIVE SWITCH -->
<!-- ================================================= -->

<div
    class="mode-switch paper-selected"
    id="modeSwitch">

<div class="mode-label paper-label">
    PAPER
</div>

<button
    id="modeToggle"
    class="mode-toggle paper-active"
    onclick="toggleMode()"
    aria-label="Cambiar entre Paper y Live">

    <span class="toggle-circle"></span>

</button>

<div class="mode-label live-label">
    LIVE
</div>

</div>


<!-- ================================================= -->
<!-- STATUS -->
<!-- ================================================= -->

<div class="status-area">

<div
    id="status"
    class="status stopped">

🔴 STOPPED

</div>

<div
    id="liveWarning"
    class="live-warning">

⚠️

</div>

</div>

</div>

</div>

<div class="buttons">

<button
    id="startButton"
    class="start"
    onclick="startBot()">

▶ START

</button>

<button
    id="stopButton"
    class="stop"
    onclick="stopBot()"
    disabled>

■ STOP

</button>

</div>

</div>


<!-- ===================================================== -->
<!-- LOGS -->
<!-- ===================================================== -->

<div class="panel">

<div class="panel-header">

<div class="log-navigation">


<!-- ================================================= -->
<!-- NOW -->
<!-- ================================================= -->

<button
    id="nowButton"
    class="active"
    onclick="showNow()">

Now

</button>


<!-- ================================================= -->
<!-- HISTORY -->
<!-- ================================================= -->

<select
    id="day"
    class="log-select placeholder"
    onchange="loadHistory()">

<option
    value=""
    class="placeholder-option">

History

</option>

</select>


<!-- ================================================= -->
<!-- TRADES -->
<!-- ================================================= -->

<select
    id="tradeDay"
    class="log-select placeholder"
    onchange="loadTrades()">

<option
    value=""
    class="placeholder-option">

Trades

</option>

</select>


</div>

</div>


<div class="logs-container">

<pre id="logs">
Cargando...
</pre>


<!-- ================================================= -->
<!-- SAVE LOGS -->
<!-- ================================================= -->

<button
    id="saveLogs"
    onclick="saveLogs()"
    disabled>

Save logs

</button>

</div>


<!-- ================================================= -->
<!-- GO TO BOTTOM -->
<!-- ================================================= -->

<button
    id="goBottom"
    onclick="goToBottom()">

↓ Go to the bottom ↓

</button>

</div>

</div>


<script>


// ============================================================
// MODE
// ============================================================

let currentMode = "paper";

let currentView = "now";


// ============================================================
// ÚLTIMO NOW MOSTRADO
// ============================================================

let lastNowLog = "";


// ============================================================
// AUTOSCROLL
// ============================================================

let autoScrollNow = true;


// ============================================================
// ESTADO DEL SAVE LOGS
// ============================================================

let nowSaved = false;


// ============================================================
// GET MODE
// ============================================================

function getMode() {

    return currentMode;

}


// ============================================================
// ACTUALIZAR ESTADO DEL BOTÓN SAVE LOGS
// ============================================================

function updateSaveLogsButton() {

    const button =
        document.getElementById(
            "saveLogs"
        );


    // ========================================================
    // SAVE LOGS SOLO EXISTE VISUALMENTE EN NOW
    // ========================================================

    if (currentView !== "now") {

        button.style.display =
            "none";

        return;

    }


    button.style.display =
        "block";


    const status =
        document.getElementById(
            "status"
        );


    // ========================================================
    // RUNNING = DESHABILITADO
    // ========================================================

    if (
        status.classList.contains(
            "running"
        )
    ) {

        button.disabled =
            true;

        return;

    }


    // ========================================================
    // SI YA SE GUARDÓ = DESHABILITADO
    // ========================================================

    if (nowSaved) {

        button.disabled =
            true;

        return;

    }


    // ========================================================
    // STOPPED + NOW PENDIENTE = HABILITADO
    // ========================================================

    button.disabled =
        false;

}


// ============================================================
// TOGGLE MODE
// ============================================================

function toggleMode() {

    const status =
        document.getElementById(
            "status"
        );

    if (
        status.classList.contains(
            "running"
        )
    ) {

        return;

    }


    if (currentMode === "paper") {

        currentMode = "live";

    } else {

        currentMode = "paper";

    }


    lastNowLog = "";

    autoScrollNow = true;

    nowSaved = false;


    updateModeUI();

    loadDays();

    loadTradeDays();

    showNow();

}


// ============================================================
// MODE UI
// ============================================================

function updateModeUI() {

    const modeSwitch =
        document.getElementById(
            "modeSwitch"
        );

    const toggle =
        document.getElementById(
            "modeToggle"
        );

    const warning =
        document.getElementById(
            "liveWarning"
        );


    if (currentMode === "live") {

        toggle.classList.remove(
            "paper-active"
        );

        toggle.classList.add(
            "live-active"
        );


        modeSwitch.classList.remove(
            "paper-selected"
        );

        modeSwitch.classList.add(
            "live-selected"
        );


        warning.style.display =
            "block";

    } else {

        toggle.classList.remove(
            "live-active"
        );

        toggle.classList.add(
            "paper-active"
        );


        modeSwitch.classList.remove(
            "live-selected"
        );

        modeSwitch.classList.add(
            "paper-selected"
        );


        warning.style.display =
            "none";

    }

}


// ============================================================
// STATUS
// ============================================================

async function updateStatus() {

    const response =
        await fetch(
            "/api/status"
        );

    const data =
        await response.json();


    const status =
        document.getElementById(
            "status"
        );

    const start =
        document.getElementById(
            "startButton"
        );

    const stop =
        document.getElementById(
            "stopButton"
        );

    const toggle =
        document.getElementById(
            "modeToggle"
        );


    if (data.running) {

        status.textContent =
            "🟢 RUNNING";

        status.className =
            "status running";

        start.disabled =
            true;

        stop.disabled =
            false;

        toggle.disabled =
            true;


        currentMode =
            data.mode;

        updateModeUI();


    } else {

        status.textContent =
            "🔴 STOPPED";

        status.className =
            "status stopped";

        start.disabled =
            false;

        stop.disabled =
            true;

        toggle.disabled =
            false;

    }


    updateSaveLogsButton();

}


// ============================================================
// START
// ============================================================

async function startBot() {

    const mode =
        getMode();


    if (mode === "live") {

        const confirmed =
            confirm(
                "⚠️ ATENCIÓN\n\n"
                + "Has seleccionado LIVE.\n\n"
                + "El bot realizará operaciones "
                + "REALES en Polymarket "
                + "utilizando fondos reales.\n\n"
                + "¿Quieres iniciar el bot LIVE?"
            );


        if (!confirmed) {

            return;

        }

    }


    // ========================================================
    // NUEVO RUN
    // ========================================================

    lastNowLog = "";

    autoScrollNow = true;

    nowSaved = false;


    const saveLogsButton =
        document.getElementById(
            "saveLogs"
        );


    saveLogsButton.disabled =
        true;


    const logs =
        document.getElementById(
            "logs"
        );

    logs.innerHTML =
        "";


    const response =
        await fetch(
            "/api/start",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify(
                    {
                        mode: mode
                    }
                )
            }
        );


    const data =
        await response.json();


    if (!data.success) {

        alert(
            data.error
            || "No se pudo iniciar el bot."
        );

        return;

    }


    updateStatus();

    loadDays();

    loadTradeDays();


    setTimeout(
        showNow,
        1000
    );

}


// ============================================================
// STOP
// ============================================================

async function stopBot() {

    const response =
        await fetch(
            "/api/stop",
            {
                method: "POST"
            }
        );


    const data =
        await response.json();


    if (!data.success) {

        alert(
            "El bot no estaba ejecutándose."
        );

        return;

    }


    // ========================================================
    // EL BACKEND DEVUELVE EL RUN FINAL COMPLETO
    // ========================================================

    currentView =
        "now";


    const nowButton =
        document.getElementById(
            "nowButton"
        );

    nowButton.classList.add(
        "active"
    );


    const day =
        document.getElementById(
            "day"
        );

    const tradeDay =
        document.getElementById(
            "tradeDay"
        );


    day.value =
        "";

    tradeDay.value =
        "";


    day.classList.add(
        "placeholder"
    );

    tradeDay.classList.add(
        "placeholder"
    );


    // ========================================================
    // GUARDAR EL LOG FINAL
    // ========================================================

    lastNowLog =
        data.log || "";


    // ========================================================
    // NUEVO LOG DISPONIBLE PARA GUARDAR
    // ========================================================

    nowSaved =
        false;


    const logs =
        document.getElementById(
            "logs"
        );


    logs.innerHTML =
        lastNowLog;


    autoScrollNow =
        true;


    logs.scrollTop =
        logs.scrollHeight;


    await loadDays();

    await loadTradeDays();

    await updateStatus();

}


// ============================================================
// SAVE LOGS
// ============================================================

async function saveLogs() {

    const status =
        document.getElementById(
            "status"
        );


    // ========================================================
    // SOLO NOW
    // ========================================================

    if (currentView !== "now") {

        return;

    }


    // ========================================================
    // SOLO STOPPED
    // ========================================================

    if (
        status.classList.contains(
            "running"
        )
    ) {

        return;

    }


    // ========================================================
    // EVITAR GUARDAR DOS VECES
    // ========================================================

    if (nowSaved) {

        return;

    }


    // ========================================================
    // IMPORTANTE:
    // MARCAR COMO GUARDADO INMEDIATAMENTE
    //
    // Así el botón NO vuelve a habilitarse durante
    // las actualizaciones de estado ni mientras se
    // ejecuta la petición.
    //
    // Solo START vuelve a poner nowSaved = false.
    // ========================================================

    nowSaved =
        true;


    const saveButton =
        document.getElementById(
            "saveLogs"
        );


    const logs =
        document.getElementById(
            "logs"
        );


    saveButton.disabled =
        true;


    const response =
        await fetch(
            "/api/save-now",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify(
                    {
                        mode: getMode()
                    }
                )
            }
        );


    const data =
        await response.json();


    if (!data.success) {

        alert(
            data.error
            || "No se pudieron guardar los logs."
        );


        // ====================================================
        // SOLO EN CASO DE ERROR REAL
        // PERMITIMOS REINTENTAR
        // ====================================================

        nowSaved =
            false;

        updateSaveLogsButton();

        return;

    }


    // ========================================================
    // BORRAR NOW
    // ========================================================

    lastNowLog =
        "";

    logs.innerHTML =
        "";


    autoScrollNow =
        true;


    logs.scrollTop =
        0;


    // ========================================================
    // ACTUALIZAR HISTORY / TRADES
    // ========================================================

    await loadDays();

    await loadTradeDays();


    // ========================================================
    // ASEGURAR NOW
    // ========================================================

    currentView =
        "now";


    document
        .getElementById(
            "nowButton"
        )
        .classList.add(
            "active"
        );


    document
        .getElementById(
            "day"
        )
        .value = "";

    document
        .getElementById(
            "tradeDay"
        )
        .value = "";


    document
        .getElementById(
            "day"
        )
        .classList.add(
            "placeholder"
        );

    document
        .getElementById(
            "tradeDay"
        )
        .classList.add(
            "placeholder"
        );


    // ========================================================
    // PERMANECE DESHABILITADO
    //
    // No se pone nowSaved = false aquí.
    // Solo START lo reseteará.
    // ========================================================

    saveButton.disabled =
        true;

}


// ============================================================
// SHOW NOW
// ============================================================

async function showNow() {

    currentView =
        "now";


    const nowButton =
        document.getElementById(
            "nowButton"
        );

    nowButton.classList.add(
        "active"
    );


    const day =
        document.getElementById(
            "day"
        );

    const tradeDay =
        document.getElementById(
            "tradeDay"
        );


    day.value = "";

    tradeDay.value = "";


    day.classList.add(
        "placeholder"
    );

    tradeDay.classList.add(
        "placeholder"
    );


    const status =
        document.getElementById(
            "status"
        );


    if (
        !status.classList.contains(
            "running"
        )
        &&
        lastNowLog
    ) {

        const logs =
            document.getElementById(
                "logs"
            );

        logs.innerHTML =
            lastNowLog;

        logs.scrollTop =
            logs.scrollHeight;

        updateSaveLogsButton();

        return;

    }


    await loadCurrentLog();

    updateSaveLogsButton();

}


// ============================================================
// CURRENT LOG
// ============================================================

async function loadCurrentLog() {

    const mode =
        getMode();


    const logs =
        document.getElementById(
            "logs"
        );


    const distanceFromBottom =
        logs.scrollHeight
        - logs.scrollTop
        - logs.clientHeight;


    const wasAtBottom =
        distanceFromBottom <= 30;


    const previousScrollTop =
        logs.scrollTop;


    const response =
        await fetch(
            "/api/log?mode="
            + mode
        );


    const data =
        await response.json();


    if (currentView === "now") {

        lastNowLog =
            data.log;

    }


    logs.innerHTML =
        data.log;


    if (
        wasAtBottom
        ||
        autoScrollNow
    ) {

        logs.scrollTop =
            logs.scrollHeight;

    } else {

        logs.scrollTop =
            previousScrollTop;

    }

}


// ============================================================
// DETECTAR SCROLL MANUAL DEL USUARIO
// ============================================================

document
    .getElementById("logs")
    .addEventListener(
        "scroll",
        function() {

            const logs = this;


            const distanceFromBottom =
                logs.scrollHeight
                - logs.scrollTop
                - logs.clientHeight;


            if (
                distanceFromBottom <= 30
            ) {

                autoScrollNow = true;

            } else {

                autoScrollNow = false;

            }

        }
    );


// ============================================================
// DAYS - HISTORY
// ============================================================

async function loadDays() {

    const mode =
        getMode();


    const response =
        await fetch(
            "/api/days?mode="
            + mode
        );


    const data =
        await response.json();


    const select =
        document.getElementById(
            "day"
        );


    select.innerHTML =
        "";


    const historyOption =
        document.createElement(
            "option"
        );


    historyOption.value =
        "";

    historyOption.textContent =
        "History";

    historyOption.className =
        "placeholder-option";


    select.appendChild(
        historyOption
    );

    async () => {

        if (

        ) {

            const status =
                document.getElementById(
                    "status"
                );


            if (

                    "running"
